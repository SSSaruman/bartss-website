<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BARTSS · Yükleme animasyonu</title>
<style>
html,body{margin:0;height:100%;font-family:Inter,"Segoe UI",Arial,sans-serif}a{color:#0c2243}a:hover{color:#ff6a1f}
.site-loader{position:fixed;inset:0;background:#eaf3fe;color:#0c2243;overflow:hidden}
.loader-stage{position:absolute;left:50%;top:54%;width:min(760px,96vw,110vh);aspect-ratio:1672/941;transform:translate(-50%,-50%)}
.lk-board{position:absolute;inset:0;width:100%;height:100%;animation:lkBoard .9s ease-out both;-webkit-mask-image:radial-gradient(closest-side,#000 72%,transparent);mask-image:radial-gradient(closest-side,#000 72%,transparent)}
.lk-top{position:absolute;left:39.77%;top:36.1%;width:19.14%;height:auto;transform-origin:50% 100%;filter:drop-shadow(0 12px 16px #1e5fd650);animation:lkDrop .6s cubic-bezier(.3,1.25,.5,1) .45s both,lkPress 1.6s ease-in-out 1.3s infinite}
.site-loader.is-pressing .lk-top{animation:lkFinal .32s ease-in both}
@keyframes lkBoard{from{opacity:0;transform:scale(1.03)}to{opacity:1;transform:none}}
@keyframes lkDrop{from{opacity:0;transform:translateY(-10%)}50%{opacity:1}to{opacity:1;transform:none}}
@keyframes lkPress{0%,50%,100%{transform:none}22%{transform:translateY(1.2%) scale(.99)}}
@keyframes lkFinal{to{transform:translateY(1.8%) scale(.985)}}
.loader-inner{position:absolute;left:0;right:0;top:calc(54% - min(760px,96vw,110vh)*.2813 - 120px);z-index:2;display:flex;flex-direction:column;align-items:center;gap:19px}
.loader-logo{display:inline-flex;align-items:flex-start;gap:.08em;font-size:clamp(30px,4.2vw,52px);font-weight:800;letter-spacing:.025em;line-height:1}
.brand-star{width:.42em;height:.42em;flex:none;overflow:visible;animation:spin 6s linear infinite}.brand-star path{fill:none;stroke:#ff6a1f;stroke-width:3.4;stroke-linecap:round}@keyframes spin{to{transform:rotate(360deg)}}
.loader-caption{font-size:12px;letter-spacing:.12em;font-weight:650;color:#3a5679}
.loader-progress{width:160px;height:3px;background:#c8d8ec;overflow:hidden;border-radius:20px}.loader-progress:after{content:'';display:block;width:40%;height:100%;border-radius:20px;background:#0c2243;animation:loadBar 1.25s ease-in-out infinite}@keyframes loadBar{0%{transform:translateX(-110%)}100%{transform:translateX(360%)}}
.site-loader.is-done{opacity:0;transition:opacity .65s}
.ctrl{position:fixed;right:20px;bottom:20px;z-index:5;display:flex;gap:8px}.ctrl button{border:1px solid #c9d5e4;background:#fff;color:#0c2243;border-radius:99px;padding:10px 16px;font:600 13px Inter,system-ui,sans-serif;cursor:pointer}.ctrl button:hover{border-color:#ff6a1f}
</style></head><body>
<div class="site-loader" id="loader"><div class="loader-stage"><img class="lk-board" src="assets/loader-keyboard.png" alt=""><img class="lk-top" src="assets/loader-key-top-cut.png" alt=""></div><div class="loader-inner"><div class="loader-logo">BARTSS<svg class="brand-star" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2v16M3.07 6l13.86 8M3.07 14l13.86-8"></path></svg></div><div class="loader-caption">SAHNE HAZIRLANIYOR</div><div class="loader-progress"></div></div></div>
<div class="ctrl"><button type="button" id="replay">Tekrar oynat</button><button type="button" id="finish">Yükleme bitti (çıkışı gör)</button></div>
<script>
const L=document.getElementById('loader');
const replay=()=>{const n=L.cloneNode(true);n.classList.remove('is-pressing','is-done');L.replaceWith(n);window.L2=n};
let cur=()=>window.L2||L;
document.getElementById('replay').onclick=()=>{replay()};
document.getElementById('finish').onclick=()=>{const l=cur();l.classList.add('is-pressing');setTimeout(()=>{l.classList.add('is-done');setTimeout(replay,1600)},340)};
</script>
</body></html>
